<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Бюрократ — Генератор обращений</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
    }
    h1 { text-align: center; }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    label {
      display: block;
      margin-top: 14px;
      font-weight: 700;
    }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    textarea { min-height: 140px; resize: vertical; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    button, a.btn {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button {
      background: #0b57d0;
      color: #fff;
    }
    .secondary {
      background: #e8eef8;
      color: #0b57d0;
    }
    pre {
      white-space: pre-wrap;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      overflow-x: auto;
    }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Бюрократ</h1>
  <div class="card">
    <form id="docForm">
      <div class="row">
        <div>

            <option value="altai-republic">Республика Алтай</option>
            <option value="bashkortostan">Республика Башкортостан</option>
            <option value="buryatia">Республика Бурятия</option>
            <option value="dagestan">Республика Дагестан</option>
            <option value="ingushetia">Республика Ингушетия</option>
            <option value="kabardino-balkaria">Кабардино-Балкарская Республика</option>
            <option value="kalmykia">Республика Калмыкия</option>
            <option value="karachay-cherkessia">Карачаево-Черкесская Республика</option>
            <option value="karelia">Республика Карелия</option>

            <option value="sakha">Республика Саха (Якутия)</option>
            <option value="north-ossetia">Республика Северная Осетия — Алания</option>
            <option value="tatarstan">Республика Татарстан</option>
            <option value="tuva">Республика Тыва</option>
            <option value="udmurtia">Удмуртская Республика</option>
            <option value="khakassia">Республика Хакасия</option>
            <option value="chechnya">Чеченская Республика</option>
            <option value="chuvashia">Чувашская Республика</option>

            <option value="altai-krai">Алтайский край</option>
            <option value="zabaykalsky-krai">Забайкальский край</option>
            <option value="kamchatka-krai">Камчатский край</option>
            <option value="krasnodar-krai">Краснодарский край</option>
            <option value="krasnoyarsk-krai">Красноярский край</option>
            <option value="perm-krai">Пермский край</option>
            <option value="primorsky-krai">Приморский край</option>
            <option value="stavropol-krai">Ставропольский край</option>
            <option value="khabarovsk-krai">Хабаровский край</option>

            <option value="amur-oblast">Амурская область</option>
            <option value="arkhangelsk-oblast">Архангельская область</option>
            <option value="astrakhan-oblast">Астраханская область</option>
            <option value="belgorod-oblast">Белгородская область</option>
            <option value="bryansk-oblast">Брянская область</option>
            <option value="vladimir-oblast">Владимирская область</option>
            <option value="volgograd-oblast">Волгоградская область</option>
            <option value="vologda-oblast">Вологодская область</option>
            <option value="voronezh-oblast">Воронежская область</option>
            <option value="ivanovo-oblast">Ивановская область</option>
            <option value="irkutsk-oblast">Иркутская область</option>
            <option value="kaliningrad-oblast">Калининградская область</option>
            <option value="kaluga-oblast">Калужская область</option>
            <option value="kemerovo-oblast">Кемеровская область — Кузбасс</option>
            <option value="kirov-oblast">Кировская область</option>
            <option value="kostroma-oblast">Костромская область</option>
            <option value="kursk-oblast">Курская область</option>
            <option value="leningrad-oblast">Ленинградская область</option>
            <option value="lipetsk-oblast">Липецкая область</option>
            <option value="magadan-oblast">Магаданская область</option>

            <option value="penza-oblast">Пензенская область</option>

            <option value="ryazan-oblast">Рязанская область</option>
            <option value="saratov-oblast">Саратовская область</option>
            <option value="sakhalin-oblast">Сахалинская область</option>
            <option value="sverdlovsk-oblast">Свердловская область</option>

            <option value="tula-oblast">Тульская область</option>
            <option value="tyumen-oblast">Тюменская область</option>

            <option value="donetsk-pr">Донецкая Народная Республика</option>
            <option value="lugansk-pr">Луганская Народная Республика</option>
          </select>
        </div>

        <div>
          <label for="docType">Тип документа</label>
          <select id="docType" required>
            <option value="">-- выберите тип --</option>
            <option value="statement">Заявление</option>
            <option value="complaint">Жалоба</option>
            <option value="request">Запрос</option>
            <option value="appeal">Обращение</option>
            <option value="petition">Ходатайство</option>
            <option value="letter">Письмо</option>
          </select>
        </div>
      </div>

      <label for="fio">ФИО</label>
      <input id="fio" type="text" placeholder="Иванов Иван Иванович" required>

      <label for="address">Адрес</label>
      <input id="address" type="text" placeholder="г. ... , ул. ... , д. ..." required>

      <label for="recipient">Кому адресовано</label>
      <input id="recipient" type="text" placeholder="В Администрацию муниципального образования ..." required>

      <label for="subject">Тема</label>
      <input id="subject" type="text" placeholder="О необходимости ..." required>

      <label for="body">Суть обращения</label>
      <textarea id="body" placeholder="Опишите обстоятельства, просьбу, требование или запрос..." required></textarea>

      <label for="legalBases">Нормативные основания (вставьте проверенный список, если нужен)</label>
      <textarea id="legalBases" placeholder="Например: 1. ...&#10;2. ..."></textarea>

      <div class="actions">
        <button type="submit">Сформировать</button>
        <a href="#" id="downloadDocx" class="btn secondary" style="display:none;">Скачать Word</a>
        <a href="#" id="downloadPdf" class="btn secondary" style="display:none;">Скачать PDF</a>
      </div>
    </form>

    <pre id="preview" style="display:none;"></pre>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    const { Document, Packer, Paragraph, TextRun } = window.docx;
    const { jsPDF } = window.jspdf;

    const typeTitles = {
      statement: "ЗАЯВЛЕНИЕ",
      complaint: "ЖАЛОБА",
      request: "ЗАПРОС",
      appeal: "ОБРАЩЕНИЕ",
      petition: "ХОДАТАЙСТВО",
      letter: "ПИСЬМО"
    };

    function getDocText(data) {
      const legalBlock = data.legalBases.trim()
        ? data.legalBases.trim()
        : "Нормативные основания: ________________________________";

      return `
${data.fio}
Адрес: ${data.address}

${data.recipient}

${typeTitles[data.docType] || "ОБРАЩЕНИЕ"}

Тема: ${data.subject}

${data.body}

${legalBlock}

Регион: ${data.regionName}
Дата: ${new Date().toLocaleDateString("ru-RU")}

Подпись: ______________________
      `.trim();
    }

    function createDocxBlob(text) {
      const paragraphs = text.split("\n").map(line =>
        new Paragraph({ children: [new TextRun(line)] })
      );

      const doc = new Document({
        sections: [{ children: paragraphs }]
      });

      return Packer.toBlob(doc);
    }

    function createPdfBlob(text) {
      const pdf = new jsPDF({ unit: "pt", format: "a4" });
      pdf.setFont("Times", "normal");
      pdf.setFontSize(12);

      const margin = 40;
      const maxWidth = 515;
      const lines = pdf.splitTextToSize(text, maxWidth);
      pdf.text(lines, margin, margin);

      return pdf.output("blob");
    }

    const regionSelect = document.getElementById("region");
    const regionNameByValue = {};
    [...regionSelect.options].forEach(opt => {
      if (opt.value) regionNameByValue[opt.value] = opt.textContent;
    });

    document.getElementById("docForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        region: regionSelect.value,
        regionName: regionNameByValue[regionSelect.value] || "",
        docType: document.getElementById("docType").value,
        fio: document.getElementById("fio").value.trim(),
        address: document.getElementById("address").value.trim(),
        recipient: document.getElementById("recipient").value.trim(),
        subject: document.getElementById("subject").value.trim(),
        body: document.getElementById("body").value.trim(),
        legalBases: document.getElementById("legalBases").value.trim()
      };

      const text = getDocText(data);

      const preview = document.getElementById("preview");
      preview.style.display = "block";
      preview.textContent = text;

      const docxBlob = await createDocxBlob(text);
      const pdfBlob = await createPdfBlob(text);

      const docxUrl = URL.createObjectURL(docxBlob);
      const pdfUrl = URL.createObjectURL(pdfBlob);

      const docxLink = document.getElementById("downloadDocx");
      const pdfLink = document.getElementById("downloadPdf");

      docxLink.href = docxUrl;
      docxLink.download = `obraschenie_${data.docType}.docx`;
      docxLink.style.display = "inline-block";

      pdfLink.href = pdfUrl;
      pdfLink.download = `obraschenie_${data.docType}.pdf`;
      pdfLink.style.display = "inline-block";
    });
  </script>
</body>
</html>
