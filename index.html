<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бюрократ | Инженерная эстетика смыслов</title>
    <style>
        :root {
            --dark-ebony: #1a1a1a;
            --walnut: #4d3a2b;
            --oak: #8c7355;
            --cream: #f5f5f0;
            --gold-accent: #c5a059;
        }

        body {
            background-color: var(--dark-ebony);
            color: var(--cream);
            font-family: 'Georgia', serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid var(--walnut);
        }

        .logo {
            font-size: 2.5rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            color: var(--gold-accent);
            margin: 0;
        }

        .subtitle {
            font-style: italic;
            color: var(--oak);
            margin-top: 10px;
        }

        main {
            flex: 1;
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .status-card {
            background: linear-gradient(145deg, #222, #1a1a1a);
            border: 1px solid var(--walnut);
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            color: var(--gold-accent);
            font-weight: normal;
            border-bottom: 1px dotted var(--oak);
            display: inline-block;
            padding-bottom: 5px;
        }

        .description {
            font-size: 1.1rem;
            margin: 30px 0;
            color: #ccc;
        }

        .nav-links {
            margin-top: 40px;
        }

        .btn {
            text-decoration: none;
            color: var(--cream);
            border: 1px solid var(--oak);
            padding: 12px 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: var(--oak);
            color: var(--dark-ebony);
        }

        footer {
            padding: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--walnut);
            border-top: 1px solid var(--walnut);
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">Бюрократ</h1>
        <div class="subtitle">Архитектура смыслов и порядок в деталях</div>
    </header>

    <main>
        <div class="status-card">
            <h2>Тестирование системы</h2>
            <p class="description">
                Проект находится в стадии активной разработки. <br>
                Мы проектируем пространство, где каждый миллиметр смысла обоснован.
            </p>
            
            <div class="nav-links">
                <a href="#" class="btn">Документация</a>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Бюрократ. Все зазоры выверены.
    </footer>

</body>
</html>
