<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Проект "Бюрократ" — Составление обращения в администрацию</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      background-color: #f7f7f7;
      color: #222;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    select, input[type="text"], textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.7rem 1.2rem;
      font-size: 1.1rem;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #004aad;
      color: white;
    }
    .output {
      margin-top: 2rem;
      padding: 1rem;
      background: #fff;
      border-radius: 4px;
      border: 1px solid #ccc;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Проект "Бюрократ"</h1>
  <p>Составьте образец письма в местную администрацию для очистки кладбища от поваленных деревьев.</p>

  <form id="requestForm">
    <label for="region">Выберите регион:</label>
    <select id="region" name="region" required>
      <option value="" disabled selected>-- Выберите регион --</option>
      <option value="moscow">Москва</option>
      <option value="tatarstan">Республика Татарстан</option>
      <option value="lenoblast">Ленинградская область</option>
      <option value="novosibirsk">Новосибирская область</option>
      <!-- Можно добавить больше регионов -->
    </select>

    <label for="userName">Ваше ФИО:</label>
    <input type="text" id="userName" name="userName" placeholder="Иванов Иван Иванович" required />

    <label for="userAddress">Ваш адрес:</label>
    <input type="text" id="userAddress" name="userAddress" placeholder="ул. Пушкина, д. 10, кв. 5" required />

    <label for="cemeteryName">Наименование кладбища:</label>
    <input type="text" id="cemeteryName" name="cemeteryName" placeholder="Пример: Городское кладбище №3" required />

    <button type="submit">Сформировать макет письма</button>
  </form>

  <div class="output" id="letterOutput" hidden></div>

  <footer>
    &copy; 2024 Проект "Бюрократ". Документы формируются с учетом законодательства РФ и региональных нормативных актов.
  </footer>

  <script>
    // Пример шаблона письма с вставкой региональных ссылок на законодательство
    const legislationLinks = {
      moscow: {
        name: "Москва",
        laws: [
          "Федеральный закон РФ №131-ФЗ от 06.10.2003 «Об общих принципах организации местного самоуправления в Российской Федерации»",
          "Правила содержания и благоустройства территорий города Москвы, утв. Постановлением Правительства Москвы № 562-ПП от 25.07.2018"
        ]
      },
      tatarstan: {
        name: "Республика Татарстан",
        laws: [
          "Федеральный закон РФ №131-ФЗ от 06.10.2003",
          "Закон Республики Татарстан «Об охране и использовании земельных ресурсов», № 23-ЗРТ от 15.05.2012"
        ]
      },
      lenoblast: {
        name: "Ленинградская область",
        laws: [
          "Федеральный закон РФ №131-ФЗ от 06.10.2003",
          "Постановление Правительства Ленинградской области № 65 от 12.02.2016"
        ]
      },
      novosibirsk: {
        name: "Новосибирская область",
        laws: [
          "Федеральный закон РФ №131-ФЗ от 06.10.2003",
          "Закон Новосибирской области «О благоустройстве населенных пунктов», № 229-ОЗ от 20.03.2015"
        ]
      }
    };

    document.getElementById('requestForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const regionKey = document.getElementById('region').value;
      const userName = document.getElementById('userName').value.trim();
      const userAddress = document.getElementById('userAddress').value.trim();
      const cemeteryName = document.getElementById('cemeteryName').value.trim();

      if (!regionKey || !userName || !userAddress || !cemeteryName) {
        alert("Пожалуйста, заполните все поля.");
        return;
      }

      const region = legislationLinks[regionKey];

      // Формируем текст обращения на основе данных
      let letterText = `
${userName}
Адрес: ${userAddress}

В администрацию муниципального образования ${region.name}

Заявление

Прошу произвести очистку кладбища "${cemeteryName}" от поваленных деревьев, представляющих угрозу безопасности и ухудшающих санитарное состояние территории.

Данное обращение основано на следующих нормативных актах:

${region.laws.map((law, i) => `${i+1}. ${law}`).join('\n')}

Прошу принять меры в соответствии с действующим законодательством Российской Федерации и нормативными актами ${region.name}.

Дата: ${new Date().toLocaleDateString('ru-RU')}
Подпись: _____________________
      `.trim();

      const outputDiv = document.getElementById('letterOutput');
      outputDiv.textContent = letterText;
      outputDiv.hidden = false;

      // Здесь можно добавить логику для генерации Word и PDF,
      // например, использование библиотек jsPDF, docx.js или отправка на сервер.
    });
  </script>
</body>
</html>
